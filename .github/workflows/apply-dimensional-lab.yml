name: Apply dimensional reasoning laboratory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dimensional-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out training-dimensions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and install the dimensional laboratory
        shell: bash
        run: |
          set -euo pipefail
          cat .dimensional-payload/part-* > /tmp/dimensional-payload.b64
          echo 'fc2972d510ab57b63ab7599875527ed9eb376e8ecb0410b1413370e66e40e092  /tmp/dimensional-payload.b64' | sha256sum --check -
          base64 --decode /tmp/dimensional-payload.b64 > /tmp/dimensional-payload.tar.gz
          echo '1c113992167a48db955a48bfbfbdefbf7d6406e2b7b5f878966f75de09584008  /tmp/dimensional-payload.tar.gz' | sha256sum --check -
          tar -xzf /tmp/dimensional-payload.tar.gz
          rm -rf assets data public/data .dimensional-payload
          rm -f scripts/export-seed.mjs
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          lock.name = 'dream-unity-training-dimensions'
          lock.version = '1.0.0'
          if (lock.packages && lock.packages['']) {
            lock.packages[''].name = 'dream-unity-training-dimensions'
            lock.packages[''].version = '1.0.0'
          }
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n')
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate inherited engine and dimensional laboratory
        run: |
          npm test
          npm run build

      - name: Commit the transformation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Transform mind mapper into 1D-12D reasoning laboratory"
          git push origin HEAD:main
