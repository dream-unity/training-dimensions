name: Export source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-once.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Upload editable source snapshot
        uses: actions/upload-artifact@v5
        with:
          name: training-dimensions-source
          path: |
            .github
            docs
            public
            scripts
            src
            .gitignore
            .nojekyll
            README.md
            app.html
            index.html
            package.json
            package-lock.json
            runtime-config.json
            tsconfig.app.json
            tsconfig.json
            tsconfig.node.json
            vite.config.ts
          include-hidden-files: true
          retention-days: 1
