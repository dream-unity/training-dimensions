name: Export life-purpose workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-life-purpose-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out training laboratory
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Package editable workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='dist' -czf /tmp/training-dimensions-workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@v5
        with:
          name: training-dimensions-life-purpose-workspace
          path: /tmp/training-dimensions-workspace.tar.gz
          retention-days: 1
