name: Export dependencies once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-dependencies-once.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Upload node modules
        uses: actions/upload-artifact@v5
        with:
          name: training-dimensions-node-modules
          path: node_modules
          include-hidden-files: true
          retention-days: 1
