name: Validate and Deploy Dimensional Reasoning Laboratory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out training laboratory
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test inherited mind-mapping engine
        run: npm test
      - name: Build dimensional reasoning laboratory
        run: npm run build
      - name: Browser smoke-test the built laboratory
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/training-dimensions-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/training-dimensions/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/training-dimensions-preview.log
            exit 1
          fi

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo 'No headless Chromium browser was found on the runner.' >&2
            exit 1
          fi

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --virtual-time-budget=4000 \
            --dump-dom \
            http://127.0.0.1:4173/training-dimensions/ \
            > /tmp/training-dimensions-dom.html

          grep --quiet 'Choose one training dimension' /tmp/training-dimensions-dom.html
          grep --quiet 'Enter 4D laboratory' /tmp/training-dimensions-dom.html
          grep --quiet '1D' /tmp/training-dimensions-dom.html
          grep --quiet '12D' /tmp/training-dimensions-dom.html
      - name: Detect whether GitHub Pages is enabled
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/pages.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == "200" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Build validated; Pages is not enabled yet'
              echo 'Open **Settings → Pages** and select **GitHub Actions** as the source, then run this workflow again.'
              echo "GitHub Pages API status: \`${status}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: needs.validate-and-build.outputs.pages-enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy dimensional reasoning laboratory
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public deployment
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in {1..24}; do
            status="$(curl --silent --show-error --location \
              --output /tmp/training-dimensions-live.html \
              --write-out '%{http_code}' \
              "${SITE_URL}?verify=${GITHUB_SHA}")"
            if [[ "$status" == "200" ]] && grep --quiet 'Training Dimensions — Dream Unity' /tmp/training-dimensions-live.html; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "Public deployment did not become verifiable at ${SITE_URL}." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "${SITE_URL%/}/assets/app.js?verify=${GITHUB_SHA}" \
            --output /tmp/training-dimensions-live.js
          curl --fail --silent --show-error --location \
            "${SITE_URL%/}/assets/app.css?verify=${GITHUB_SHA}" \
            --output /tmp/training-dimensions-live.css
          test -s /tmp/training-dimensions-live.js
          test -s /tmp/training-dimensions-live.css
