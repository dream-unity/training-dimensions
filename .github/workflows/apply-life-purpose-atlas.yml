name: Apply comprehensive Life Purpose atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-life-purpose-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out training-dimensions
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct the worked-map atlas
        shell: bash
        run: |
          set -euo pipefail
          cat patches/life-purpose-atlas-*.b64 > /tmp/life-purpose-atlas.b64
          test "$(wc -c < /tmp/life-purpose-atlas.b64)" -eq 60552
          base64 --decode /tmp/life-purpose-atlas.b64 > /tmp/life-purpose-atlas-payload.tar.gz
          echo 'ca4721e6563ee529600300744b159ec3d7f15887a838ed568814002c52b5bed8  /tmp/life-purpose-atlas-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/life-purpose-atlas-payload.tar.gz
          test -s src/life-purpose-example-data.ts
          test -s src/LifePurposeExampleExplorer.tsx
          test -s src/life-purpose-examples.css
          test -s src/life-purpose-example-data.test.ts
          test -s apply_life_purpose_atlas.py

      - name: Integrate the atlas without removing the existing guide
        run: |
          set -euo pipefail
          python3 apply_life_purpose_atlas.py
          rm apply_life_purpose_atlas.py

      - name: Verify the twelve maps are genuinely worked and dimension-specific
        shell: bash
        run: |
          set -euo pipefail
          grep --fixed-strings --quiet 'How to map every dimension' src/dimension-experiences.tsx
          grep --fixed-strings --quiet 'One question. Twelve genuinely different mind maps.' src/App.tsx
          grep --fixed-strings --quiet 'life-purpose-atlas-section' src/App.tsx
          grep --fixed-strings --quiet 'onOpenLifePurposeExample' src/App.tsx
          grep --fixed-strings --quiet 'Complete worked mind map · one subject across every dimension' src/LifePurposeExampleExplorer.tsx
          grep --fixed-strings --quiet 'Life Purpose as an interacting system' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose as a self-transforming temporal loop' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose as a space of possible lives' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose as an output of hidden generative rules' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose translated across coherent frameworks' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose rotated through observers and scales' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose as an evolving ecology of models' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose as a deliberately engineered learning architecture' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose inside co-evolving adaptive architectures' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Life Purpose remapped by inventing new dimensions' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Delayed Burnout Signal' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Excluded Outsider' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Purpose Red-Team' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'beneficiary radius' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'identity permeability' src/life-purpose-example-data.ts
          grep --fixed-strings --quiet 'Axis Revision Rule' src/life-purpose-example-data.ts

      - name: Install dependencies
        run: npm ci

      - name: Run inherited and atlas-specific tests
        run: npm test

      - name: Build and synchronise production assets
        run: npm run pages:prepare

      - name: Verify production bundle contains the atlas
        shell: bash
        run: |
          set -euo pipefail
          grep --fixed-strings --quiet 'Training Dimensions — Dream Unity' index.html
          grep --fixed-strings --quiet 'One question. Twelve genuinely different mind maps.' assets/app.js
          grep --fixed-strings --quiet 'Complete worked mind map' assets/app.js
          grep --fixed-strings --quiet 'Delayed Burnout Signal' assets/app.js
          grep --fixed-strings --quiet 'Purpose Red-Team' assets/app.js
          grep --fixed-strings --quiet 'Axis Revision Rule' assets/app.js
          grep --fixed-strings --quiet '.life-purpose-atlas-section' assets/app.css
          git diff --check

      - name: Browser-render the actual front-page atlas
        shell: bash
        run: |
          set -euo pipefail
          static_root="$(mktemp -d)"
          mkdir -p "$static_root/training-dimensions"
          cp -a dist/. "$static_root/training-dimensions/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$static_root" > /tmp/life-atlas-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4173/training-dimensions/ >/dev/null && break
            sleep 1
          done
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1600,2200 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:4173/training-dimensions/ > /tmp/life-atlas-dom.html
          sed -E 's/<[^>]+>/ /g' /tmp/life-atlas-dom.html | tr '\n' ' ' | tr -s '[:space:]' ' ' > /tmp/life-atlas-text.txt
          grep --fixed-strings --quiet 'Worked example atlas · Life Purpose' /tmp/life-atlas-text.txt
          grep --fixed-strings --quiet 'One question. Twelve genuinely different mind maps.' /tmp/life-atlas-text.txt
          grep --fixed-strings --quiet 'Complete worked mind map · one subject across every dimension' /tmp/life-atlas-text.txt
          grep --fixed-strings --quiet 'Open an editable copy' /tmp/life-atlas-text.txt
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1600,2200 --virtual-time-budget=7000 --screenshot=/tmp/life-purpose-atlas.png http://127.0.0.1:4173/training-dimensions/
          test -s /tmp/life-purpose-atlas.png

      - name: Upload visual verification
        uses: actions/upload-artifact@v5
        with:
          name: life-purpose-atlas-browser-check
          path: /tmp/life-purpose-atlas.png
          retention-days: 2

      - name: Commit comprehensive examples and production assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patches
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No atlas changes were required.'
            exit 0
          fi
          git commit -m 'Implement comprehensive Life Purpose maps across 1D–12D'
          git push origin HEAD:main
