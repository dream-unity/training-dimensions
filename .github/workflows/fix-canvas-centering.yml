name: Finalize canvas centering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-canvas-centering.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out training laboratory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Centre the world on the canvas viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          source = path.read_text()
          old = """            transform: `translate(calc(50% + ${view.panX}px), calc(50% + ${view.panY}px)) scale(${view.scale}) translate(${-WORLD_CENTRE.x}px, ${-WORLD_CENTRE.y}px)`,
          """
          new = """            left: '50%',
            top: '50%',
            transform: `translate(${view.panX}px, ${view.panY}px) scale(${view.scale}) translate(${-WORLD_CENTRE.x}px, ${-WORLD_CENTRE.y}px)`,
          """
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one canvas transform to repair; found {count}.')
          repaired = source.replace(old, new)
          if repaired.count("left: '50%'") < 1 or repaired.count("top: '50%'") < 1:
              raise SystemExit('Canvas-centering anchors were not written.')
          path.write_text(repaired)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test inherited mind-mapping engine
        run: npm test

      - name: Build and synchronise the production site
        run: npm run pages:prepare

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/app.js
          test -s assets/app.css
          test -s index.html
          git diff --check

      - name: Commit repaired source and production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx index.html .nojekyll assets
          if git diff --cached --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi
          git commit -m 'Centre dimensional maps correctly in the viewport'
          git push origin HEAD:main
